version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'npm'
    open-pull-requests-limit: 10
    groups:
      development-dependencies:
        patterns:
          - '@types/*'
          - 'eslint*'
          - 'prettier*'
          - 'typescript*'
          - 'vitest*'
          - 'tsx*'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        patterns:
          - '@prisma/client'
          - 'bcrypt'
          - 'cors'
          - 'dotenv'
          - 'express'
          - 'express-rate-limit'
          - 'helmet'
          - 'jsonwebtoken'
          - 'swagger-ui-express'
          - 'yamljs'
          - 'zod'
          - 'axios'
          - 'react'
          - 'react-dom'
          - 'react-router-dom'
          - 'tailwindcss'
          - 'autoprefixer'
          - 'postcss'
          - 'vite'
          - '@vitejs/plugin-react'
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    labels:
      - 'dependencies'
      - 'github-actions'
    open-pull-requests-limit: 5