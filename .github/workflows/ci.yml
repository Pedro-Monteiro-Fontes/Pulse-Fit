name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  NPM_VERSION: '10.x'

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint (all workspaces)
        run: npm run lint

      - name: Run format check (all workspaces)
        run: npm run format -- --check

      - name: Typecheck shared
        run: npx tsc --noEmit -p shared/tsconfig.json

      - name: Typecheck api
        run: npx tsc --noEmit -p api/tsconfig.json

      - name: Typecheck frontend
        run: npx tsc --noEmit -p frontend/tsconfig.json

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared
        run: npm run build -w shared

      - name: Build api
        run: npm run build -w api

      - name: Build frontend
        run: npm run build -w frontend

  test:
    name: Test (placeholder)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          echo "No tests configured yet. Add tests when implementation is complete."
          # npm run test -w shared
          # npm run test -w api
          # npm run test -w frontend
        shell: bash